[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastrtc-canary"
version = "0.1.0"
description = "FastRTC speech-to-text"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "eschmidbauer", email = "eschmidbauer@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "librosa",
    "numpy>=2.0.2",
    "nemo_toolkit[asr]",
]

[project.urls]
"Homepage" = "https://github.com/eschmidbauer/fastrtc-canary"
"Bug Tracker" = "https://github.com/eschmidbauer/fastrtc-canary/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
]
audio = [
    "librosa>=0.9.0",  # For audio processing
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
